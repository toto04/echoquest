; EchoQuest controller firmware
;
; Platform: pioarduino fork (the official platformio/espressif32 platform does
; not support Arduino on the ESP32-C6). Pinned to a specific release, never "stable".
;   55.03.312-1 -> Arduino core 3.3.12, ESP-IDF 5.5.5
; To upgrade: pick a release from
; https://github.com/pioarduino/platform-espressif32/releases, change the URL in
; [common], run `pio run`, then reflash and smoke-test pairing.

[platformio]
default_envs = esp32-c6-devkitc-1

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2

; Debug build (default): serial logging enabled.
[env:esp32-c6-devkitc-1]
platform = ${common.platform}
board = esp32-c6-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; Route `Serial` to the on-chip USB-Serial/JTAG (the port labelled "USB"
  ; on the DevKitC-1), not the UART bridge.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DECHO_DEBUG=1
  -Wall

; Same firmware with serial logging compiled out.
[env:release]
extends = env:esp32-c6-devkitc-1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DECHO_DEBUG=0
  -Wall

; Host-side unit tests for pure logic (protocol packing, descriptor, debouncer).
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Wall
test_build_src = no
