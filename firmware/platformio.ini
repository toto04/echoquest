; EchoQuest controller firmware
;
; Platform: pioarduino fork (the official platformio/espressif32 platform does
; not support Arduino on the ESP32-C6). Pinned to a specific release, never "stable".
;   55.03.312-1 -> Arduino core 3.3.12, ESP-IDF 5.5.5
; To upgrade: pick a release from
; https://github.com/pioarduino/platform-espressif32/releases, change the URL in
; [common], run `pio run`, then reflash and smoke-test pairing.
;
; Environments (board profiles live in include/config.h):
;   waveshare-c6-lcd147  Waveshare ESP32-C6-Touch-LCD-1.47: real IMU, LCD, touch buttons (default)
;   esp32-c6-devkitc-1   Espressif DevKitC-1: GPIO buttons/hat, FakeImu
;   release              DevKitC-1 with logging compiled out
;   native               host unit tests (pio test -e native)

[platformio]
default_envs = waveshare-c6-lcd147

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
build_flags =
  ; Route `Serial` to the on-chip USB-Serial/JTAG (the native USB port), not a UART bridge.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall

; Espressif ESP32-C6-DevKitC-1, debug logging on.
[env:esp32-c6-devkitc-1]
platform = ${common.platform}
board = esp32-c6-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ${common.build_flags}
  -DBOARD=BOARD_DEVKITC1
  -DECHO_DEBUG=1

; Same firmware with serial logging compiled out.
[env:release]
extends = env:esp32-c6-devkitc-1
build_flags =
  ${common.build_flags}
  -DBOARD=BOARD_DEVKITC1
  -DECHO_DEBUG=0

; Waveshare ESP32-C6-Touch-LCD-1.47 (ESP32-C6FH8, 8 MB flash, same board
; definition as the DevKitC-1), debug logging on.
[env:waveshare-c6-lcd147]
extends = env:esp32-c6-devkitc-1
lib_deps =
  ${common.lib_deps}
  moononournation/GFX Library for Arduino@1.6.9
build_flags =
  ${common.build_flags}
  -DBOARD=BOARD_WAVESHARE_C6_LCD147
  -DECHO_DEBUG=1

; Host-side unit tests for pure logic (protocol, descriptor, debouncer, orientation filter).
[env:native]
platform = native
build_flags = -std=c++17 -Wall
test_build_src = no
