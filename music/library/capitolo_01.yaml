# Chapter 1 music: the orchestra's song, Scene 2's piano phrases and Scene 3's first battle.
# Format and rules: docs/music/05-format-and-pipeline.md. Check with:
#   python3 -m tools.music.check music/library/capitolo_01.yaml
# Everything here follows docs/music/06-worked-example.md unless a comment says why it differs.
# Registers (Scene 2's choice, 01-palette.md): button letters D F A C are D4 F4 A4 C5, or one octave
# lower ("grave": D3-C4) or higher ("acuto": D5-C6). With "grave" the reserved call register moves
# down to C3-D4, so the backing tracks marked `register: grave` are re-voiced to keep it clear.

# ------------------------------------------------------------------ the spine

- id: theme_canzone_del_concerto
  role: theme
  centre: F
  tempo: 100
  meter: 4/4
  steps_per_bar: 8
  chords: [F, Dm7, Bb, Csus4, F, Dm7, Gm7, F]
  intent: "the stolen song (06 §1); every battle call in chapter 1 derives from one of its pieces"
  bars:
    - "C - A - F - - ."
    - "D - . . F D - ."
    - "A A C - A A F -"
    - "C - - - A - - ."
    - "=1"
    - "=2"
    - "C A C A C - A -"
    - "A - C - F - - -"

# ------------------------------------------------------------------ Scene 2: the piano introduces itself

- id: s2_saluto
  role: theme
  centre: F
  tempo: 100
  steps_per_bar: 8
  input: locked
  intent: "two playful notes, do-mi up (the opposite direction of the song's falling head): the piano says hello"
  bars: ["F A . . . . . ."]

- id: s2_allegra
  role: theme
  centre: F
  tempo: 100
  steps_per_bar: 8
  input: locked
  intent: "a cheerful free phrase, rising ti-ti ta twice and home on F; never starts with C-A, so it can't be mistaken for the stolen head"
  bars: ["D F A - F A C -", "A - F - - - . ."]

- id: s2_comiche
  role: theme
  centre: D
  tempo: 100
  steps_per_bar: 8
  input: locked
  intent: "two comic notes after the Maestro's joke: a leap down, staccato (the 'ehm' of the piano)"
  bars: ["C . D . . . . ."]

# ------------------------------------------------------------------ Scene 3: the first battle (06 §2-6)

- id: sfida_piano_r1
  role: call
  stage: 2
  centre: D
  tempo: 100
  instrument: piano
  intent: "TA... TA-TA on the index button only; judged by structure (order + relative rhythm). Surprise: the inner rest"
  motif: {rhythm: "x - . . x x - .", contour: "*rr"}
  bars: ["D - . . D D - ."]

- id: sfida_piano_r2
  role: call
  stage: 2
  centre: D
  tempo: 100
  instrument: piano
  intent: "same rhythm, the middle note moves up to the middle button: la ... do-la (= song bar 2)"
  motif: {rhythm: "x - . . x x - .", contour: "*ud"}
  development: [{op: repitch, of: sfida_piano_r1}]
  bars: ["D - . . F D - ."]

- id: sfida_piano_r3
  role: call
  stage: 2
  centre: D
  tempo: 100
  instrument: piano
  intent: "Sbuffo's scrambled version starts from the top: mi ... do-la; the falling answer, same rhythm; the ring finger is the new button"
  motif: {rhythm: "x - . . x x - .", contour: "*dd"}
  bars: ["A - . . F D - ."]

# No round asks the child to fill a silence on time (the missing-note "answer" of an earlier draft
# was too hard): every round is an echo of the same rhythm, one new button at a time.

- id: loop_sfida_piano_A
  role: loop
  centre: D
  tempo: 100
  meter: 4/4
  steps_per_bar: 8
  loop_bars: 8
  call_bars: [1, 2, 5, 6]
  chords: [Dm, Dm, Dm, Dm, C5, C5, C5, C5]
  intent: "two-chord ostinato (i-bVII), broken bordun, marcia percussion; one chord per long exchange (call, call, echo, reply); drive from the shaker, not the tempo"
  tracks:
    bass:
      instrument: pizzicato_strings
      layer: L0
      register: [normale, acuto]
      bars:
        - "D2 - A2 - D2 - A2 -"
        - "=1"
        - "=1"
        - "D2 - A2 - D2 A2 D3 A2"
        - "C2 - G2 - C2 - G2 -"
        - "=5"
        - "=5"
        - "C2 - G2 - A2 - C3 -"     # walk-up back to D2 at the loop restart
    bass_grave:                     # D3 and C3 would enter the grave call register (C3-D4)
      instrument: pizzicato_strings
      layer: L0
      register: grave
      bars:
        - "D2 - A2 - D2 - A2 -"
        - "=1"
        - "=1"
        - "D2 - A2 - D2 A2 D2 A2"
        - "C2 - G2 - C2 - G2 -"
        - "=5"
        - "=5"
        - "C2 - G2 - G2 - A2 -"
    pad:
      instrument: strings
      layer: L1
      register: [normale, acuto]
      bars:
        - "D3+F3+A3 - - - - - - -"
        - "=1"
        - "=1"
        - "=1"
        - "C3+G3 - - - - - - -"
        - "=5"
        - "=5"
        - "=5"
    pad_grave:                      # flipped register map: comping above the low call, silent in call bars
      instrument: strings
      layer: L1
      register: grave
      muted_in_call_bars: true
      bars:
        - "F4+A4+D5 - - - - - - -"
        - "=1"
        - "=1"
        - "=1"
        - "G4+C5 - - - - - - -"
        - "=5"
        - "=5"
        - "=5"
    hits:
      instrument: timpani
      layer: L3
      bars:
        - ". . . . . . . ."
        - "=1"
        - "D2 . . . . . . ."         # beat 1 of the echo bar: "go!"
        - "=1"
        - "=1"
        - "=1"
        - "C2 . . . . . . ."
        - "=1"
    drums:
      layer: L0
      steps_per_bar: 16
      lanes:
        kick:     ["x . . . . . . . x . . . . . . .", "=1", "=1", "=1", "=1", "=1", "=1", "=1"]
        block_hi: [". . . . x . . . . . . . x . . .", "=1", "=1", "=1", "=1", "=1", "=1", ". . . . x . . . . . . . x . x x"]
        shaker:   ["x . x . x . x . x . x . x . x .", "=1", "=1", "=1", "=1", "=1", "=1", "=1"]

- id: intro_sbuffo
  role: intro
  input: locked
  tempo: 100
  steps_per_bar: 8
  chords: [Dm, Bbm]
  intent: "Sbuffo arrives: his cell C-A-D short-short-long on pan flute (04 character sheet), then the minor-third villain slide Dm -> Bbm with a slide whistle; locked, so Bbm's Db is allowed. Ends on a low timpani hit"
  tracks:
    sbuffo:
      instrument: pan_flute
      layer: L3
      bars: ["C5 A4 D4 - - - . .", ". . . . . . . ."]
    strings:
      instrument: strings
      layer: L1
      bars: ["D3+F3+A3 - - - - - - -", "Db3+F3+Bb3 - - - - - . ."]
    timp:
      instrument: timpani
      layer: L3
      bars: [". . . . . . . .", ". . . . . . D2 ."]

- id: count_in
  role: intro
  tempo: 100
  steps_per_bar: 8
  intent: "game-wide constant: the Maestro's baton TAC, TAC... TOC (bar 1), then his voice 'uno, due, tre... via!' over soft clicks on beats 1-3 (bar 2); the loop starts on the next downbeat"
  tracks:
    baton:
      layer: L0
      lanes:
        claves:   ["x - x - . . . .", ". . . . . . . ."]
        block_lo: [". . . . . . x -", ". . . . . . . ."]
        block_hi: [". . . . . . . .", "x . x . x . . ."]

- id: turn_cue
  role: stinger
  meter: 1/4
  steps_per_bar: 2
  tempo: 100
  intent: "the TOC on beat 4 of the last call bar: 'tocca a te'; identical in every battle of the game"
  tracks:
    baton:
      layer: L0
      lanes:
        block_lo: ["x -"]

- id: sting_ok
  role: stinger
  meter: 1/4
  steps_per_bar: 4
  tempo: 100
  intent: "verdict on beat 4 of the echo bar: rising button arpeggio, fits any safe chord"
  tracks:
    sparkle:
      instrument: celesta
      layer: L2
      buttons: true
      bars: ["D F A C"]

- id: sting_notyet
  role: stinger
  meter: 1/4
  steps_per_bar: 2
  tempo: 100
  intent: "one soft low note, not a buzzer"
  tracks:
    soft:
      instrument: marimba
      layer: L2
      buttons: true
      gain: 0.6
      bars: ["D -"]

# 06's taunt is two bars over Gm7 -> Bbmaj7. The game plays it in the reply bar of the failed
# exchange (bar 4), so the next exchange can start on time with the same call: one bar, locked.
- id: taunt_sbuffo
  role: taunt
  input: locked
  tempo: 100
  steps_per_bar: 8
  chords: [Gm7]
  intent: "Sbuffo laughs: staccato bassoon 'ha-ha-ha' falling, then a falling trombone wobble; snare pickup into the next exchange. Funny, never sad: no slow descending minor line"
  tracks:
    bassoon:
      instrument: bassoon
      layer: L3
      bars: ["D3 D3 C3 A2 . . . ."]
    trombone:
      instrument: trombone
      layer: L3
      bars: [". . . . F2 - Bb1 -"]
    drums:
      layer: L0
      steps_per_bar: 16
      lanes:
        snare: [". . . . . . . . . . . . . . x x"]

- id: fanfare_win_piano
  role: fanfare
  input: locked
  tempo: 100
  steps_per_bar: 12
  chords: ["Bb C5", "D"]
  intent: "Mario-like whole-step lift Bb-C-D in triplets, parallel fifths; the final D major (Picardy) hit is allowed because input is locked"
  tracks:
    brass_top:
      instrument: brass_section
      layer: L3
      bars: ["F4 F4 F4 F4 - - G4 G4 G4 G4 - -", "A4 - - - - - - - - - - ."]
    brass_low:
      instrument: brass_section
      layer: L3
      bars: ["Bb3 Bb3 Bb3 Bb3 - - C4 C4 C4 C4 - -", "D4+F#4 - - - - - - - - - - ."]
    timpani:
      instrument: timpani
      layer: L3
      bars: ["Bb1 . . . . . C2 . . . . .", "D2 - - - - - - - - - - ."]

- id: reprise_piano
  role: loop
  loop: false
  centre: F
  tempo: 100
  steps_per_bar: 8
  chords: [F, Dm7, F, F]
  intent: "victory: the piano plays song bars 1-2 complete (the stolen F is back), then the head again and the song's final cadence; Sbuffo's cell returns softly as a redeemed countermelody in the last bar"
  tracks:
    piano:
      instrument: piano
      layer: L2
      buttons: true
      bars: ["C - A - F - - .", "D - . . F D - .", "=1", "A - C - F - - -"]
    bass:
      instrument: acoustic_bass
      layer: L0
      register: [normale, acuto]
      bars: ["F2 - C3 - F2 - C3 -", "D2 - A2 - D2 - A2 -", "=1", "C2 - G2 - F2 - - -"]
    bass_grave:
      instrument: acoustic_bass
      layer: L0
      register: grave
      bars: ["F2 - C2 - F2 - C2 -", "D2 - A2 - D2 - A2 -", "=1", "C2 - G2 - F2 - - -"]
    pad:
      instrument: strings
      layer: L1
      register: [normale, acuto]
      bars: ["F2+C3+A3 - - - - - - -", "C3+F3+A3 - - - - - - -", "=1", "F2+C3+A3 - - - - - - -"]
    pad_grave:                      # below the low piano: open fifths and thirds under C3
      instrument: strings
      layer: L1
      register: grave
      bars: ["F2+A2 - - - - - - -", "D2+A2 - - - - - - -", "=1", "F2+A2 - - - - - - -"]
    sbuffo_redeemed:
      instrument: pan_flute
      layer: L4
      gain: 0.6
      bars: [". . . . . . . .", "=1", "=1", ". . . . C6 A5 D5 -"]

# ------------------------------------------------------------------ Scene 4: the first note is back

- id: s4_campanella
  role: theme
  input: locked
  tempo: 100
  steps_per_bar: 8
  intent: "the campanella's motif A-C-A (04 character sheet), ringing quarters, an octave up: a bell wakes up next to the piano"
  tracks:
    bell:
      instrument: celesta
      layer: L4
      bars: ["A5 - C6 - A5 - - -"]

- id: s4_libero
  role: loop
  loop: false
  centre: F
  tempo: 100
  steps_per_bar: 8
  chords: [F, Dm7, F, Dm7, F]
  intent: "free play (stage 0, no calls): the recovered piece twice and a close, with the bell two octaves above the buttons and a soft marcia pulse; every button press is consonant (F6/Dm7, no forbidden notes), so there is no wrong note"
  tracks:
    bell:
      instrument: celesta
      layer: L4
      bars: ["C7 - A6 - F6 - - .", "D6 - . . F6 D6 - .", "=1", "=2", "A6 - C7 - F6 - - -"]
    bass:
      instrument: acoustic_bass
      layer: L0
      bars: ["F2 - C2 - F2 - C2 -", "D2 - A2 - D2 - A2 -", "=1", "=2", "F2 - - - - - - -"]
    pad:
      instrument: strings
      layer: L1
      register: [normale, acuto]
      bars: ["F2+C3+A3 - - - - - - -", "C3+F3+A3 - - - - - - -", "=1", "=2", "F2+C3+A3 - - - - - - -"]
    pad_grave:
      instrument: strings
      layer: L1
      register: grave
      bars: ["F2+A2 - - - - - - -", "D2+A2 - - - - - - -", "=1", "=2", "F2+A2 - - - - - - -"]
    drums:
      layer: L0
      steps_per_bar: 16
      gain: 0.7
      lanes:
        kick:     ["x . . . . . . . x . . . . . . .", "=1", "=1", "=1", "x . . . . . . . . . . . . . . ."]
        block_hi: [". . . . x . . . . . . . x . . .", "=1", "=1", "=1", ". . . . . . . . . . . . . . . ."]

- id: s4_fanfara_comica
  role: fanfare
  input: locked
  tempo: 100
  steps_per_bar: 8
  intent: "a small comic piano fanfare for the 'diploma': a proud rising F arpeggio, a held high F, then a clumsy low plonk"
  tracks:
    piano:
      instrument: piano
      layer: L3
      bars: ["F4 A4 C5 F5 - - - .", "C2 . . . . . . ."]
